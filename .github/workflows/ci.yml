name: ci

# Verifies a tree on push and on pull request.
#
# Until this file existed the repository had no push/PR CI at all: the only
# thing that ever built anything was update.yml, on a schedule. A commit was
# therefore unverified until the next upstream bump happened to build it, and a
# bad commit was attributed to whichever bump first tripped over it.
#
# The split into two jobs is about one derivation. `checks.cowork-fhs-paths`
# asserts against the *trimmed* QEMU — `qemu.override { hostCpuOnly = true; … }`
# — and an override is a different derivation from `qemu_kvm`, so no binary
# cache carries it and every run that needs it compiles QEMU from source. On
# this repository's hardware that is ~18 minutes; on a 4-core runner with no
# cache configured (see update.yml on why there is none) it is far worse.
#
# So it runs when its inputs move and not otherwise. See the gate in the
# `lean-qemu` job for exactly which inputs those are and why the list is
# complete.
on:
  push:
    # The automation's own branch is excluded: create-pull-request force-pushes
    # it, and the pull_request event below already covers the PR it opens.
    # Without this every stable bump would run this workflow twice on one tree.
    branches-ignore:
      - update/**
  pull_request:

permissions:
  contents: read

# Superseding a push makes the older run's answer worthless, so unlike the
# workflows that *write* to branches, cancelling in progress is correct here —
# there is no landing step whose loss would strand a verified result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a cache can serve. Kept to one job because these share the
  # claude-desktop build: splitting them would re-download and re-unpack the
  # ~160 MB .deb once per job.
  checks:
    name: build and cheap checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # Same reasoning as update.yml: the .deb is ~160 MB, the unpacked
      # derivation ~500 MB, and the FHS rootfs adds a second copy of the
      # closure on top of that.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Formatting
        run: |
          set -euo pipefail
          nix fmt -- --check .

      # Named explicitly rather than run via `nix flake check`, which offers no
      # way to skip a single check — that is the whole reason the lean job below
      # can exist. Keep this list in sync with flake.nix's `checks`; the
      # evaluation step below is what catches an addition that was forgotten
      # here.
      - name: Build packages and checks
        run: |
          set -euo pipefail
          nix build -L \
            .#default \
            .#claude-desktop-fhs \
            .#checks.x86_64-linux.wrapper-flags \
            .#checks.x86_64-linux.dlopen-runpath \
            .#checks.x86_64-linux.cowork-fhs-paths-full-qemu

          # Prove the output is usable, not merely buildable — a bad
          # autoPatchelf run still produces a store path.
          test -x ./result/bin/claude-desktop
          test -f ./result/lib/claude-desktop/chrome-sandbox
          test -f ./result/share/applications/com.anthropic.Claude.desktop

      # Evaluating the skipped check costs nothing and is not the same as
      # trusting it: it proves the lean path still *evaluates* — that nobody
      # renamed an attribute or broke the override — on every run, while the
      # expensive part of actually building it stays gated below.
      #
      # Listing every check and diffing against what was built above is what
      # keeps the hand-written list in the previous step honest. A check added
      # to flake.nix and not added there fails here rather than silently going
      # unrun.
      - name: Every check is either built above or deliberately gated
        run: |
          set -euo pipefail
          all=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
                | jq -r '.[]' | sort)
          # cowork-fhs-paths is the lean-QEMU one, gated into its own job.
          accounted=$(printf '%s\n' \
            wrapper-flags dlopen-runpath cowork-fhs-paths-full-qemu \
            cowork-fhs-paths | sort)

          if ! diff <(echo "$all") <(echo "$accounted"); then
            echo "::error::flake.nix's checks and this workflow's list have drifted."
            echo "Add the new check to the build step above, or to the gated job."
            exit 1
          fi

          # Force the gated check through evaluation without building it.
          nix eval --raw .#checks.x86_64-linux.cowork-fhs-paths.drvPath
          echo

      - name: Dev channel outputs evaluate
        run: |
          set -euo pipefail
          nix eval --raw .#claude-desktop-dev.name
          echo
          test "$(nix eval --raw .#claude-desktop-dev.passthru.channel)" = dev

  # The trimmed-QEMU assertion. Its own job so that the common push pays
  # nothing for it, and so that when it does run its ~18+ minutes are visible
  # as their own line in the UI rather than hidden inside a step.
  lean-qemu:
    name: cowork-fhs-paths (trimmed qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate diffs against a base commit, which a shallow clone may not
          # contain.
          fetch-depth: 0

      # Which inputs can change what this check tests:
      #
      #   flake.lock                   nixpkgs moves -> a different QEMU source
      #                                tree, different defaults, different
      #                                meaning for every override below.
      #   pkgs/claude-desktop-fhs.nix  holds the override list itself. Trimming
      #                                one feature too many is the exact failure
      #                                this check exists to catch, so gating on
      #                                flake.lock alone — as originally sketched
      #                                — would skip the check precisely when it
      #                                matters most.
      #   pkgs/cowork-fhs-paths.nix    the assertions.
      #   flake.nix                    wires the check and pins leanQemu.
      #
      # sources.json is deliberately absent: an upstream bump changes the app
      # payload, not the QEMU, and cowork-fhs-paths-full-qemu already re-runs
      # every path assertion against the new rootfs on the cached QEMU.
      - name: Decide whether the trimmed QEMU needs rebuilding
        id: gate
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = pull_request ]; then
            # checkout above is unshallow, so this only has to make sure the
            # base branch itself is present as a remote-tracking ref.
            git fetch --no-tags --force origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi

          # A new branch reports an all-zero "before", and a force-push can name
          # a commit that no longer exists. Both mean "cannot tell" — and the
          # safe answer to that is to run the check, never to skip it.
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "cannot resolve base '$base' — running the check rather than guessing"
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD -- \
            flake.lock flake.nix pkgs/claude-desktop-fhs.nix pkgs/cowork-fhs-paths.nix)

          if [ -n "$changed" ]; then
            echo "inputs to the trimmed QEMU changed:"
            printf '  %s\n' $changed
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "no input to the trimmed QEMU changed since $base — skipping the source build."
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.gate.outputs.run == 'true'
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # A QEMU source build needs materially more room than the app alone.
      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build the check against the trimmed QEMU
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          nix build -L .#checks.x86_64-linux.cowork-fhs-paths
